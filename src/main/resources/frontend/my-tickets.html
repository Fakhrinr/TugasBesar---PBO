<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Tickets - CRM Tubes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <link rel="stylesheet" th:href="@{/css/technician/ticket.css}">
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="s-brand"><i class="bi bi-grid-fill"></i></div>
    <a th:href="@{/dashboard}" class="s-link" title="Dashboard"><i class="bi bi-grid"></i></a>
    
    <a th:href="@{/subscription}" class="s-link" title="Subscription"><i class="bi bi-calendar-check"></i></a>
    <a th:href="@{/notifications}" class="s-link" title="Notification"><i class="bi bi-bell"></i></a>
    <a th:href="@{/technician/my-tickets}" class="s-link active" title="Tickets"><i class="bi bi-ticket-perforated"></i></a>
    <hr/>
      <a th:href="@{/logout}" class="s-link s-logout" title="Logout"><i class="bi bi-box-arrow-right"></i></a>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon" id="menuToggle" style="display:none">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 5a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 5a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1z" clip-rule="evenodd"/></svg>
        </button>
        <div>
          <div class="page-title">My Tickets</div>
          <div class="page-subtitle">Review assigned support tickets and open ticket details.</div>
        </div>
      </div>
      <div class="topbar-right">
        <a th:href="@{/notifications}" class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a6 6 0 0 0-6 6v3.586l-.707.707A1 1 0 0 0 4 14h12a1 1 0 0 0 .707-1.707L16 11.586V8a6 6 0 0 0-6-6zM10 18a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/></svg>
          <span class="notif-dot"></span>
        </a>
        <div class="avatar" th:text="${user != null && user.name != null ? #strings.substring(user.name,0,2).toUpperCase() : 'TK'}">TK</div>
      </div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Assigned Tickets</span>
          <span>
            <strong th:text="${tickets != null ? #lists.size(tickets) : 0}">0</strong>
            entries
          </span>
        </div>

        <div class="card-body table-wrap">
          <table>
            <thead>
            <tr>
              <th>Ticket ID</th>
              <th>Title</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Created At</th>
              <th class="text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
              <td class="ticket-id">
                #TK-<span th:text="${ticket.id}">1</span>
              </td>
              <td>
                <div class="ticket-title" th:text="${ticket.title != null ? ticket.title : 'Untitled Ticket'}">Connection issue</div>
              </td>
              <td>
                <span class="ticket-badge priority" th:text="${ticket.priority != null ? ticket.priority : 'NORMAL'}">HIGH</span>
              </td>
              <td>
                <span class="ticket-badge status" th:text="${ticket.status != null ? ticket.status : 'OPEN'}">OPEN</span>
              </td>
              <td class="muted-cell" th:text="${ticket.createdAt != null ? ticket.createdAt : '-'}">2026-06-16</td>
              <td class="text-right">
                <a class="ticket-action" th:href="@{/technician/my-tickets/{id}(id=${ticket.id})}">
                  <span class="material-symbols-outlined">visibility</span>
                  View Details
                </a>
              </td>
            </tr>
            <tr th:if="${tickets == null || #lists.isEmpty(tickets)}">
              <td colspan="6" class="empty-state">No assigned tickets</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
